[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "Retrieval-augmented Q&A with an evaluation harness: chunkers, BM25/dense/hybrid retrieval, cited answers and metrics"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
requires-python = ">=3.10"
keywords = ["rag", "retrieval", "evaluation", "bm25", "hybrid-search", "fastapi", "bangla"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1",
  "httpx>=0.26",
  "numpy>=1.24,<3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
pgvector = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "pypdf>=4.0",
]

[project.scripts]
rag-eval = "rag_eval_lab.cli:main"

[tool.setuptools.packages.find]
include = ["rag_eval_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends()/File() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["rag_eval_lab"]
